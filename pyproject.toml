[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-security-ci"
version = "1.0.0"
description = "Offline regression gate for AgentProbe security reports"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "youyin99"}]
keywords = ["agent-security", "ci", "release-gate", "regression-testing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent-security-ci = "agent_security_ci.cli:main"

[tool.setuptools.packages.find]
include = ["agent_security_ci*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"
